<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Naslov web aplikacije-->
    <h1>CALCULATOR</h1> 
    <!-- Tijelo kalkulatora ekran tipke -->
    <div class="calculator"> 
        <div>
            <input type="text" id="display" readonly>
        </div>
        <div class="output">
            <button id="delet">AC</button>
            <button id="equal">=</button>
        </div>
        <div class="input">
            <div class="firstRow">
                <button id="btn_Number">7</button>
                <button id="btn_Number">8</button>
                <button id="btn_Number">9</button>
                <button id="btn_Operator">+</button>
            </div>
            <div class="secondRow">
                <button id="btn_Number">4</button>
                <button id="btn_Number">5</button>
                <button id="btn_Number">6</button>
                <button id="btn_Operator">-</button>
            </div>
            <div class="thirdRow">
                <button id="btn_Number">1</button>
                <button id="btn_Number">2</button>
                <button id="btn_Number">3</button>
                <button id="btn_Operator">*</button>
            </div>
            <div class="fourthRow">
                <button id="btn_Brackets">()</button>
                <button id="btn_Number">0</button>
                <button id="btn_Comma">,</button>
                <button id="btn_Operator">/</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
